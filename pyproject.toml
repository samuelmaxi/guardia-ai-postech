[project]
name = "guardia-ai"
version = "0.1.0"
description = "Guardiã AI: apoio à triagem de risco materno com ML, RAG e LLM"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-anthropic>=0.3",
    "langchain-xai>=0.1",
    "langchain-groq>=0.2",
    "fastembed>=0.4",
    "faiss-cpu>=1.8",
    "pypdf>=5.0",
    "streamlit>=1.40",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "jupyter>=1.1", "nbconvert>=7", "markdown>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardia"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
